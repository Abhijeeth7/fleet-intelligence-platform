services:
  postgres-db:
    image: postgres:18-alpine
    container_name: portal_postgres_service
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${LOCAL_DB_PORT}:5432"
    volumes:
      - postgres_portal_storage:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi-backend:
    build: ./backend
    container_name: portal_fastapi_backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy

  streamlit-frontend:
    build: ./frontend
    container_name: portal_streamlit_frontend
    environment:
      - BACKEND_URL=${BACKEND_URL}
    ports:
      - "8501:8501"
    depends_on:
      - fastapi-backend

volumes:
  postgres_portal_storage:
